[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pylattice"
version = "0.1.0"
description = "Hex lattice module frames, connectivity graph and UDP multicast client"
readme = "README.md"
requires-python = ">=3.11"          # StrEnum
license = "MIT"
authors = [{ name = "Lee Marshall", email = "lee@wanker.biz" }]
dependencies = [
    "stupidartnet>=1.6.0",
    "uvicorn",
    "mido",
    # mido's default backend, but it cannot build on PyPy - there the ctypes
    # portmidi backend is used instead (brew install portmidi).
    "python-rtmidi; platform_python_implementation == 'CPython'",
    "fastapi>=0.141.1",
]

# Every pylattice subpackage - examples, effects, runner, fields - not a hand-kept list.
[tool.setuptools.packages.find]
include = ["pylattice*"]

[tool.setuptools.package-data]
pylattice = ["py.typed"]            # PEP 561: let consumers' type checkers use our annotations
