# Both faders start at 0. fader_b fades in over the first two measures, then every
# two measures from bar 4 the faders trade places instantly on the downbeat. Wipes hit only on beat 1 of each bar, from bar 3.
#   python -m pylattice.lightingmidi examples/kidney_ones.yaml
tempo: 120
time_signature: [4, 4]
length: 227
presets: ../presets

tracks:
  - name: lighting
    channel: 1
    rules:
      - {preset: 17, at: 1.1.1}
      # A beat after the preset change, so the preset's stored knobs don't win.
      - {set: fader_a, value: 0.0, at: 1.2.1}
      - {set: fader_b, value: 0.0, at: 1.2.1}

      # Fade-in on fader_b: from 1.2.1 (a beat after the preset) to land on 3.1.1
      - {ramp: fader_b, from: 0.0, to: 1.0, start: 1.2.1, end: 3.1.1}

      # Wipes on every beat from the downbeat of bar 3, dimmed by fader_b
      - {fire: wipe1, direction: up, speed: 0.8, on: [1], from: 3, to: 227}

      # bar 4: a 0->1, b 1->0
      - {set: fader_a, value: 1.0, at: 4.1.1}
      - {set: fader_b, value: 0.0, at: 4.1.1}
      # bar 6: a 1->0, b 0->1
      - {set: fader_a, value: 0.0, at: 6.1.1}
      - {set: fader_b, value: 1.0, at: 6.1.1}
