<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>lattice</title>
<link rel="stylesheet" href="/static/mobile.css">

<div class="app">
  <header>
    <span id="fps">…</span>
    <button id="preset-chip">preset —</button>
  </header>

  <nav class="effects" id="effects"></nav>

  <main id="main">
    <div class="slots" id="slots"></div>

    <!-- covers the slots, never the effects bar -->
    <!-- the knob that moved last, over everything, for two seconds -->
    <div class="ccbar" id="ccbar" hidden>
      <svg class="dial" viewBox="0 0 40 40" aria-hidden="true">
        <path id="dial-track" fill="none" stroke="#39414d" stroke-width="4" stroke-linecap="butt"/>
        <path id="dial-value" fill="none" stroke="#6a8fd0" stroke-width="4" stroke-linecap="butt"/>
        <line id="dial-pin" stroke="#cfe3ff" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <b id="cc-comments"></b>
      <span id="cc-val"></span>
      <span id="cc-num"></span>
    </div>

    <div class="modal" id="modal" hidden>
      <div class="modal-bar">
        <button id="modal-back">‹ back</button>
        <span id="modal-title"></span>
        <button id="modal-close">✕</button>
      </div>
      <div class="picker" id="picker"></div>
    </div>
  </main>
</div>

<script src="/static/mobile.js"></script>
