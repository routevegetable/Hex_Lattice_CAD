<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lattice v3</title>
<link rel="stylesheet" href="/static/v3.css">

<header>
  <span id="fps">…</span>
  <div id="presets" class="presets"></div>
  <span id="preset-num" class="dim"></span>
  <span id="preset-name" class="preset-name"></span>
  <span id="named" class="fpick"><button id="named-open" title="play a preset by name">named ▾</button></span>
  <button id="save-copy" title="keep a copy of what is playing as a new preset; this one keeps playing">save copy as…</button>
  <button id="new-preset" title="start a new named preset with every slot blank, and play it">new preset…</button>
  <span id="saved" class="dim"></span>
  <button id="wide" class="wide-toggle" aria-pressed="false" title="let the effects take the whole width of the window">full width</button>
</header>

<div class="cols">
  <main id="effects"></main>
  <aside id="map"></aside>
</div>

<dialog id="copy-dialog">
  <form method="dialog">
    <h2 id="copy-title">save a copy</h2>
    <label>name <input id="copy-name" type="text" maxlength="32" autocomplete="off"
           placeholder="letters, digits and single dashes"></label>
    <p class="dim">number</p>
    <div id="copy-grid" class="copy-grid"></div>
    <p id="copy-why" class="dim"></p>
    <div class="copy-actions">
      <button type="button" id="copy-cancel">cancel</button>
      <button type="submit" id="copy-ok">save</button>
    </div>
  </form>
</dialog>

<script src="/static/v3.js"></script>
